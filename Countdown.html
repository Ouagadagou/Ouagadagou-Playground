<!DOCTYPE html>
<html>

<head>
    <title>Countdown</title>
    <link rel="stylesheet" href="Countdown.css">
</head>

<body>
    <h1 class="center header">Countdown</h1>
    <div class="center">
        <input id="input-h" class="center input">
        <input id="input-m" class="center input">
        <input id="input-s" class="center input">
    </div>
    <br style="line-height: 100px;">
    <div class="center">
        <button class="button" type="button" id="start" onclick="start()">Start</button>
        <button class="hidden button" type="button" id="pause" onclick="pause()">Pause</button>
        <button class="hidden button" type="button" id="resume" onclick="resume()">Resume</button>
        <button class="button" type="button" id="reset" onclick="reset()">Reset</button>
    </div>
    <br style="line-height: 30px">
    <div  class="center text">
        <span id="hours" style="padding-right: 5px;">00</span>
        <span style="padding-right: 5px;">:</span>
        <span id="minutes" style="padding-right: 5px;">00</span>
        <span style="padding-right: 5px;">:</span>
        <span id="seconds" style="padding-right: 5px;">00</span>
    </div>
    <br style="line-height: 30px">
    <div class="center">
        <button class="button" type="button" id="Save" onclick="save()">Save</button>
    </div>
    <br style="line-height: 30px">
    <ul id="time" class="list hidden"></ul>
</body>

<script src="Countdown.js"></script>

</html>
