<html>

<head>
    <title>Hello World</title>
    <link rel="stylesheet" href="test.css">
</head>

<body>
    <h1 class="center header">Search</h1>
    <div class="center">
        <input id="input" class="center input">
    </div>
</body>
<script>
    var inputId = document.getElementById("input")
    var inputValue = document.getElementById("input").value
    inputId.addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            var inputValue = document.getElementById("input").value;
            console.log(inputValue);
            window.open(`https://www.google.com/search?q=${inputValue}`);
        }
    })
</script>

</html>
